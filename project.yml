name: MediaPocket
options:
  bundleIdPrefix: io.github.lucus3310
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MARKETING_VERSION: "0.9.1"
    CURRENT_PROJECT_VERSION: "10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    revision: 6629ecb91e7e05e6b3fcbf77b17d0421cff37923
targets:
  MediaPocket:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Resources/runner.py
          - Resources/download_engine.py
          - "**/__pycache__"
      - path: Sources/Resources/runner.py
        buildPhase: resources
      - path: Sources/Resources/download_engine.py
        buildPhase: resources
    dependencies:
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lucus3310.MediaPocket
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  MediaPocketPlaybackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlaybackTests
    dependencies:
      - target: MediaPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lucus3310.MediaPocket.PlaybackTests
        GENERATE_INFOPLIST_FILE: YES
  MediaPocketKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KeyboardUITests
    dependencies:
      - target: MediaPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lucus3310.MediaPocket.KeyboardUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MediaPocket
schemes:
  MediaPocketKeyboardUI:
    build:
      targets:
        MediaPocket: all
    test:
      targets:
        - MediaPocketKeyboardUITests
  MediaPocket:
    build:
      targets:
        MediaPocket: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - MediaPocketPlaybackTests
