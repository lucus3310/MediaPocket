name: MediaPocket
options:
  bundleIdPrefix: io.github.lucus3310
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MARKETING_VERSION: "0.10.1"
    CURRENT_PROJECT_VERSION: "12"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  NativeFFmpeg:
    path: build/native/FFmpegKit
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    revision: 6629ecb91e7e05e6b3fcbf77b17d0421cff37923
targets:
  MediaPocket:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Resources/runner.py
          - Resources/download_engine.py
          - Resources/embedded_runner.py
          - Resources/resolver_policy.py
          - Resources/ResolverMediaGuard.js
          - "**/__pycache__"
      - path: Sources/Resources/runner.py
        buildPhase: resources
      - path: Sources/Resources/download_engine.py
        buildPhase: resources
      - path: Sources/Resources/embedded_runner.py
        buildPhase: resources
      - path: Sources/Resources/resolver_policy.py
        buildPhase: resources
      - path: Sources/Resources/ResolverMediaGuard.js
        buildPhase: resources
      - path: NativeSupport/MPEmbedded.c
    dependencies:
      - package: NativeFFmpeg
        product: ffmpegkit
      - framework: build/native/Python.xcframework
        embed: true
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lucus3310.MediaPocket
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: NativeSupport/include/MPEmbedded.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-needed_framework,ffmpegkit"]
    postBuildScripts:
      - name: Embed Python standard library and extension frameworks
        script: python3 "$PROJECT_DIR/scripts/embed-python.py"
        basedOnDependencyAnalysis: false
  MediaPocketPlaybackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlaybackTests
    dependencies:
      - target: MediaPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lucus3310.MediaPocket.PlaybackTests
        GENERATE_INFOPLIST_FILE: YES
  MediaPocketKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KeyboardUITests
    dependencies:
      - target: MediaPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lucus3310.MediaPocket.KeyboardUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MediaPocket
  MediaPocketNativeReleaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlaybackTests/NativeDownloadTests.swift
    dependencies:
      - target: MediaPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lucus3310.MediaPocket.NativeReleaseTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MediaPocketNativeRelease:
    build:
      targets:
        MediaPocket: all
    test:
      config: Release
      targets:
        - MediaPocketNativeReleaseTests
  MediaPocketKeyboardUI:
    build:
      targets:
        MediaPocket: all
    test:
      targets:
        - MediaPocketKeyboardUITests
  MediaPocket:
    build:
      targets:
        MediaPocket: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - MediaPocketPlaybackTests
